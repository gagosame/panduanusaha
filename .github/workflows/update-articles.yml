name: Update Artikel Homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update homepage
        run: python3 update_articles.py

      - name: Commit perubahan
        run: |
          git config user.name "PanduanUsaha Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update artikel otomatis"
          git push
